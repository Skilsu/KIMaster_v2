services:
  swtp-server:
    build:
      context: ./
      dockerfile: ./Server/Dockerfile
    image: swtp-server-img
    container_name: swtp-server
    restart: always

    environment:
      - SERVER_HOST=swtp-server
      - SERVER_PORT=8010
      - NETWORK=swtp-net
      - WORKER=1
      - KEYLEN=5
    
    ports:
      - "8010:8010"
    networks:
      - swtp-net
    volumes:
      - ${DOCKER_SOCK_PATH}:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: '0'
    depends_on:
      - swtp-database

  swtp-game-client:
    build:
      context: ./
      dockerfile: ./GameClient/Dockerfile
    image: game-client-img
    networks:
      - swtp-net
    depends_on:
      - swtp-server

  swtp-frontend:
    build:
      context: ./
      dockerfile: ./Frontend/Dockerfile
    image: frontend-img
    restart: always
    container_name: swtp-frontend
    networks:
      - swtp-net
    depends_on:
      - swtp-server
    ports:
      - "8086:8080"
  
  swtp-frontend-debug:
    build:
      context: ./
      dockerfile: ./FrontendDebug/Dockerfile
    image: frontend-debug-img
    restart: always
    container_name: swtp-frontend-debug
    networks:
      - swtp-net
    depends_on:
      - swtp-server
    ports:
      - "8087:8080"

  swtp-test:
    build: ./Test
    image: swtp-test-img
    container_name: swtp-test
    networks:
      - swtp-net
    depends_on:
      - swtp-server

  # MySQL-Datenbank-Service
  swtp-database:
    image: mysql:8.0
    container_name: swtp-database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: -W$7,tM&:uL{)KS_UN.u$a.K#YajG}E-b>8EYM7c-rDxC_eaWu=Be
      MYSQL_DATABASE: kimaster_db
      MYSQL_USER: kimaster_dbuser
      MYSQL_PASSWORD: kimasterpw123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - swtp-net

networks:
  swtp-net:
    name: swtp-net

volumes:
  db_data:
    driver: local
